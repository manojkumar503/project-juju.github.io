            text-align: center;

</head>

<body>

<div class="container">

    <header>
        <h1>🌡️ Measuring Temperature</h1>
        <p>ESP32 Based IoT Temperature Monitoring System</p>
    </header>

    <div class="status" id="status">
        Connecting to sensor cloud...
    </div>

    <div class="cards">

        <div class="card">
            <div class="icon">🌡️</div>
            <h2>Temperature</h2>

            <div class="value temperature">
                <span id="temperature">--</span>
                <span class="unit">°C</span>
            </div>

            <p>Measured using DHT11</p>
        </div>

        <div class="card">
            <div class="icon">💧</div>
            <h2>Humidity</h2>

            <div class="value humidity">
                <span id="humidity">--</span>
                <span class="unit">%</span>
            </div>

            <p>Relative humidity</p>
        </div>

    </div>

    <button onclick="loadData()">Refresh Readings</button>

    <p id="lastUpdate">Last update: Waiting for data</p>

    <footer>
        ESP32 + DHT11 | IoT Monitoring Dashboard
    </footer>

</div>

<script>
    // Replace with your actual ThingSpeak Channel ID.
    const CHANNEL_ID = "3528650";

    // Keep empty when your ThingSpeak channel is public.
    const READ_API_KEY = "";

    async function loadData() {
        const status = document.getElementById("status");

        status.textContent = "Loading latest sensor readings...";

        try {
            let url =
                `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json`;

            if (READ_API_KEY !== "") {
                url += `?api_key=${encodeURIComponent(READ_API_KEY)}`;
            }

            const response = await fetch(url, {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error("Cloud request failed: " + response.status);
            }

            const data = await response.json();

            if (data.field1 == null || data.field2 == null) {
                throw new Error("No sensor data received yet.");
            }

            const temperature = Number(data.field1);
            const humidity = Number(data.field2);

            if (!Number.isFinite(temperature) ||
                !Number.isFinite(humidity)) {
                throw new Error("Invalid sensor values.");
            }

            document.getElementById("temperature").textContent =
                temperature.toFixed(1);

            document.getElementById("humidity").textContent =
                humidity.toFixed(1);

            document.getElementById("lastUpdate").textContent =
                "Last cloud update: " +
                new Date(data.created_at).toLocaleString();

            status.textContent = "Connected | Sensor readings updated";

        } catch (error) {
            status.textContent = "Unable to load readings: " + error.message;
        }
    }

    // Load immediately and refresh every 20 seconds.
    loadData();
    setInterval(loadData, 20000);
</script>

</body>
</html>
